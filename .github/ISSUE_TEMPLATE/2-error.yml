name: Error
description: Algo no funciona como debería.
title: 'fix: '
labels: ['bug']
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué debería pasar
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Dónde
      multiple: true
      options:
        [Escritorio, Tablet, Móvil, Modo noche, Inglés, Movimiento reducido]
  - type: textarea
    id: capturas
    attributes:
      label: Capturas
